name: sts
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.14.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # .env holds the Supabase and MQTT settings. Bundling it means every way of running the app gets them.
  assets:
    - .env
  uses-material-design: true
